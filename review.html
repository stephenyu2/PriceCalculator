<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leave a Review | Launch Valley Tutoring</title>
  <meta name="description" content="Share your experience with Launch Valley Tutoring." />
  <meta name="robots" content="noindex" />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Fira+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/launch.css" />
</head>
<body>
  <main class="review-screen review-page-texture">
    <section class="review-box">
      <a href="/" aria-label="Return to Launch Valley Tutoring home"><span class="brand">Launch Valley Tutoring</span></a>
      <h1>How did we do?</h1>
      <p class="lead">Your feedback takes 10 seconds and means the world to our team.</p>

      <div class="rating-stars" role="group" aria-label="Choose a rating from one to five stars"
           data-rating
           data-google-url="https://g.page/r/CaZ4rOFZeCDUEAE/review"
           data-sms="sms:+18186383908?&body=">
        <button type="button" class="rating-star" aria-label="1 star"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"/></svg></button>
        <button type="button" class="rating-star" aria-label="2 stars"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"/></svg></button>
        <button type="button" class="rating-star" aria-label="3 stars"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"/></svg></button>
        <button type="button" class="rating-star" aria-label="4 stars"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"/></svg></button>
        <button type="button" class="rating-star" aria-label="5 stars"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"/></svg></button>
      </div>

      <div class="review-powered">
        <svg class="google-mark" viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--google-blue)" d="M21.6 12.23c0-.71-.06-1.4-.18-2.07H12v3.92h5.38a4.6 4.6 0 0 1-2 3.02v2.54h3.24c1.9-1.75 2.98-4.33 2.98-7.41Z"/><path fill="var(--google-green)" d="M12 22c2.7 0 4.98-.9 6.63-2.36l-3.24-2.54c-.9.6-2.05.96-3.39.96-2.61 0-4.82-1.76-5.61-4.13H3.04v2.62A10 10 0 0 0 12 22Z"/><path fill="var(--google-yellow)" d="M6.39 13.93A6.02 6.02 0 0 1 6.08 12c0-.67.11-1.32.31-1.93V7.45H3.04A10 10 0 0 0 2 12c0 1.61.38 3.14 1.04 4.55l3.35-2.62Z"/><path fill="var(--google-red)" d="M12 5.94c1.47 0 2.79.5 3.83 1.5l2.87-2.87A9.63 9.63 0 0 0 12 2a10 10 0 0 0-8.96 5.45l3.35 2.62C7.18 7.7 9.39 5.94 12 5.94Z"/></svg>
        <span>Powered by Google Reviews</span>
      </div>

      <div class="review-feedback" data-feedback-box hidden>
        <h2>How can we do better?</h2>
        <p>Your message goes directly to our team.</p>
        <label for="private-feedback">Private feedback</label>
        <textarea id="private-feedback" rows="5" placeholder="Tell us about your experience…" data-feedback-text></textarea>
        <button type="button" class="btn btn-ink btn-full" style="margin-top:1rem" data-feedback-send>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
          Send Private Feedback
        </button>
      </div>
    </section>
  </main>

  <script src="/launch.js" defer></script>
</body>
</html>
